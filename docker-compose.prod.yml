services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: benka_workbench
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or environment}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Port NOT exposed — only reachable by backend inside Docker network

  backend:
    build: ./backend
    restart: always
    env_file: ./backend/.env
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pg_data:
