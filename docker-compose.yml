# Local development only — SQLite is simpler (see deploy_local.md)
# Use docker-compose.prod.yml for production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: benka_workbench
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"   # bound to localhost only
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app   # source mount for hot-reload

volumes:
  pg_data:
